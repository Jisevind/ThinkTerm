[package]
name = "thinkterm-import-herdr"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thinkterm-import.workspace = true

# Only unix hosts a live handoff; Windows imports the saved layout.
[target.'cfg(unix)'.dependencies]
log.workspace = true
tempfile.workspace = true
uuid = { workspace = true, features = ["v4"] }
rustix = { version = "1.1.2", features = ["net", "termios", "fs", "process"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["term", "socket"] }

config.workspace = true
wezterm-term.workspace = true
