<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 604" width="1000" height="604" role="img" aria-labelledby="t d">
<title id="t">ThinkTerm vs kitty</title>
<desc id="d">kitten __benchmark__ · Ubuntu 20.04 · i9-12900K · MB/s, höher ist besser. Nur ASCII-Zeichen: ThinkTerm 147,4, kitty 79,4 (1,9×); Unicode-Zeichen: ThinkTerm 85,6, kitty 78,7 (1,1×); CSI-Sequenzen mit wenigen Zeichen: ThinkTerm 50,0, kitty 44,0 (1,1×); Lange Escape-Sequenzen: ThinkTerm 533,5, kitty 238,1 (2,2×); Bilder: ThinkTerm 391,8, kitty 181,0 (2,2×).</desc>
<defs>
<linearGradient id="ours" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0071e3"/><stop offset="1" stop-color="#2b8cff"/></linearGradient>
<filter id="glow" x="-10%" y="-80%" width="120%" height="300%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0071e3" flood-opacity="0.28"/></filter>
</defs>
<style>
