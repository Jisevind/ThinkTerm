# Build and test on Linux and Windows, when asked to from the Actions tab.
#
# Until this existed, nothing in .github/workflows ran automatically except a
# probe on one branch, and nothing anywhere ran `cargo test` on Windows or in
# a pull request. Two consequences were live in the tree at the time this was
# added: a stray attribute left the Windows build broken for a stretch of
# commits, and a test calling a function that had moved crates left
# `cargo test` on unix not compiling at all. Neither could have survived a
# green run of this file.
#
# Both platforms, because the two failures above were each invisible from the
# other one: the test that did not compile is `#[cfg(unix)]`, and the build
# that broke was Windows-only.

name: ci

# Manual only: start it from the Actions tab when the answer is wanted.
# Every run bills minutes on a private repo, Windows at twice the rate.
on:
  workflow_dispatch:

# Cancel a superseded run when several commits are pushed back to back
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'

jobs:
  linux:
    name: linux x86_64
    runs-on: ubuntu-latest
    # Backstop: a hung job would otherwise burn the default 6h, which on a
    # private repo is 360 billed minutes.
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Check submodules
        run: bash ci/check-submodules.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ci-linux-x86_64
          cache-on-failure: true
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Install dependencies
        run: env CI=yes PATH=$PATH ./get-deps

      # The browser page's own tests (thinkterm-web/ui/tests): Node and the
      # page's locked packages, no wasm build.
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test the web page
        run: |
          bash ci/retry.sh npm ci --prefix thinkterm-web/ui --no-audit --no-fund
          npm test --prefix thinkterm-web/ui

      # `cargo test` compiles the whole workspace, binaries included, so this
      # is the build as well. --no-fail-fast because one crate's failure
      # should not hide the rest of the tree's.
      - name: Build and test
        run: cargo test --workspace --no-fail-fast

  # Windows on arm64 builds natively on its own runner rather than cross
  # from x86_64, so the tests run on the arch they were built for. That
  # runner is free on public repos only; on a private one the leg fails.
  windows:
    name: windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs_on: windows-2022
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runs_on: windows-11-arm
            target: aarch64-pc-windows-msvc

    env:
      RUSTUP_WINDOWS_PATH_ADD_BIN: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # `shell: bash` is required here; the default on Windows is pwsh.
      - name: Check submodules
        shell: bash
        run: bash ci/check-submodules.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # The build below targets the host, so an x86_64 toolchain on the arm
      # runner would quietly test the emulated build instead.
      - name: Check host
        shell: bash
        run: |
          rustc -vV
          [ "$(rustc -vV | sed -n 's/^host: //p')" = '${{ matrix.target }}' ]

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ci-windows-${{ matrix.arch }}
          cache-on-failure: true
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      # wezterm-gui's build script stages these next to the test binaries,
      # as the x86_64 leg gets its checked-in copies.
      - name: Fetch the arm64 DLLs
        if: matrix.arch == 'arm64'
        shell: bash
        run: bash ci/windows-arm64-assets.sh

      # openssl-src needs perl; Strawberry Perl ships on the runner but is not
      # on PATH by default. `cmd`'s builtin `PATH <value>` form, as the
      # release workflow uses. On arm64, ring compiles its C with clang,
      # which the runner image ships.
      - name: Build and test
        shell: cmd
        run: |
          PATH C:\Strawberry\perl\bin;%PATH%
          cargo test --workspace --no-fail-fast

# The wasm32 portability sentinel runs on the same events, from its own file:
# see .github/workflows/wasm.yml.
